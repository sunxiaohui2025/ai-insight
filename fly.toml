# fly.toml app configuration file generated for ai-insight on 2026-08-21T10:58:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-insight'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  INSIGHT_DATABASE = '/data/insight.db'
  INSIGHT_LLM_BASE_URL = 'http://1.181.141.96:6018'
  INSIGHT_LLM_MODEL = 'qwen3.5-397b-a17b'
  INSIGHT_PUBLIC_URL = 'https://ai-insight.fly.dev'
  INSIGHT_WEB_BUILD = '/app/web_build'

[[mounts]]
  source = 'insight_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 20
    soft_limit = 10

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
